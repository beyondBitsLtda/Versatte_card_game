<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#04070D">
  <meta name="description" content="Versatte Cards — colecione cartas dos clubes e ídolos da Série A e troque por brindes. Protótipo por Beyond Bits.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Versatte Cards">
  <title>Versatte Cards</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
  <script>
    /* Ajuste de tela: mede a área visível e, se o celular abrir a página com viewport de
       desktop (ex.: "Site para computador"), aplica zoom para tudo voltar ao tamanho real. */
    (function () {
      var d = document.documentElement, z0 = 0;
      function fit() {
        var iw = window.innerWidth, ih = window.innerHeight, sw = screen.width, z = 1;
        var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
        if (coarse && sw && sw < 760 && iw > sw * 1.2) z = iw / sw;
        else if (coarse && !z0 && window.visualViewport && visualViewport.scale < 0.8) z = 1 / visualViewport.scale;
        z0 = z;
        d.style.zoom = z > 1 ? String(z) : '';
        d.classList.toggle('zoomed', z > 1);
        var w = iw / z, hh = ih / z;
        d.style.setProperty('--vw', w / 100 + 'px');
        d.style.setProperty('--vh', hh / 100 + 'px');
        d.style.setProperty('--vmax', Math.max(w, hh) / 100 + 'px');
        d.style.setProperty('--vmin', Math.min(w, hh) / 100 + 'px');
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
      if (window.visualViewport) visualViewport.addEventListener('resize', function () { if (!z0 || z0 === 1) fit(); });
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-glow g1"></div>
    <div class="bg-glow g2"></div>
    <div class="bg-grid"></div>
    <img class="bg-wm" src="assets/logo-versatte.png" alt="">
  </div>

  <div class="shell">
    <header class="topbar">
      <button class="brand" aria-label="Início">
        <img src="assets/logo-versatte.png" alt="">
        <span>VERSATTE <b>CARDS</b></span>
      </button>
      <div class="chips" id="chips"></div>
    </header>
    <main id="view" class="viewport"></main>
    <nav id="tabbar" class="tabbar" aria-label="Navegação"></nav>
  </div>

  <div id="overlay-root"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div id="intro" class="intro" hidden>
    <div class="in-beyond">
      <div class="in-sweep"></div>
      <img src="assets/logo-beyond.png" alt="Beyond Bits">
      <span>apresenta</span>
    </div>
    <div class="in-vs">
      <div class="in-ring"></div>
      <div class="in-ring r2"></div>
      <img src="assets/logo-versatte.png" alt="Versatte">
      <h1>VERSATTE <b>CARDS</b></h1>
      <p>Colecione · Complete · Ganhe</p>
      <span class="in-tap">Toque para começar</span>
    </div>
    <button class="in-skip">Pular</button>
  </div>

  <noscript>Ative o JavaScript para jogar Versatte Cards.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
